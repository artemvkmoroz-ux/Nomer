<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Генератор Номеров — Обмен</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0f0f13;
    --bg-card: #1c1c22;
    --bg-card-hover: #25252d;
    --accent: #5c6bc0;
    --gold: #ffd700;
    --success: #4ade80;
    --danger: #f87171;
    --text: #ffffff;
    --text-dim: #8a8a9a;
    --border: #2c2c35;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }

  #appScreen { display: flex; flex-direction: column; height: 100vh; }

  /* Верхняя панель */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; z-index: 10;
  }
  .balance-pill {
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 20px;
    font-weight: 800; font-size: 1.1rem; color: var(--gold);
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.2s;
  }
  .balance-pill.flash { transform: scale(1.1); }
  
  .top-buttons { display: flex; gap: 10px; }
  .icon-btn {
    background: var(--bg-card); border: 1px solid var(--border);
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: background 0.2s; font-size: 1.2rem;
    color: var(--text);
  }
  .icon-btn:active { background: var(--bg-card-hover); }

  /* Основная зона */
  .main-area {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 25px;
  }

  /* Редкость */
  .rarity-badge {
    padding: 8px 20px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim);
    transition: all 0.3s;
  }
  .rarity-badge.common { color: #aaa; border-color: #444; }
  .rarity-badge.rare { color: #6bb6ff; border-color: rgba(107,182,255,0.4); box-shadow: 0 0 15px rgba(107,182,255,0.1); }
  .rarity-badge.epic { color: #d4a3ff; border-color: rgba(212,163,255,0.4); box-shadow: 0 0 15px rgba(212,163,255,0.1); }
  .rarity-badge.legendary { color: #ffd700; border-color: rgba(255,215,0,0.5); box-shadow: 0 0 20px rgba(255,215,0,0.2); }
  .rarity-badge.mythic { color: #ff6b6b; border-color: rgba(255,107,107,0.5); box-shadow: 0 0 25px rgba(255,107,107,0.3); }

  /* Номер */
  .plate-scene { perspective: 1000px; width: 100%; display: flex; justify-content: center; }
  .plate-wrap { cursor: pointer; transition: transform 0.15s; }
  .plate-wrap:active { transform: scale(0.96); }

  .plate {
    display: flex; border: 3px solid #444; border-radius: 8px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    height: 100px; align-items: stretch;
    background: linear-gradient(180deg, #e8e8e8 0%, #d0d0d0 100%);
    min-width: 300px; justify-content: center;
    position: relative; overflow: hidden;
  }
  .plate::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
    pointer-events: none; z-index: 2;
  }
  .plate-main {
    display: flex; align-items: center; padding: 0 20px;
    font-size: 3.8rem; font-weight: 800; color: #1a1a1a; letter-spacing: 2px;
    font-family: "Arial Narrow", "JetBrains Mono", monospace;
    white-space: nowrap; z-index: 1;
  }
  .plate-region {
    width: 75px; border-left: 3px solid #444;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 6px 0; background: rgba(0,0,0,0.03);
  }
  .region-num { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; line-height: 1; margin-top: 6px; }
  .region-label { font-size: 0.8rem; font-weight: 800; color: #1a1a1a; display: flex; align-items: center; gap: 3px; margin-bottom: 4px; }
  .flag { width: 20px; height: 13px; border: 1px solid #999; display: flex; flex-direction: column; }
  .flag div { flex: 1; }

  /* Инфо */
  .value-display { font-size: 1.6rem; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; text-align: center; }
  .value-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; text-align: center; }

  /* Кнопки */
  .actions { display: flex; gap: 12px; width: 100%; max-width: 400px; }
  .btn {
    flex: 1; border: none; padding: 15px 12px; border-radius: 14px;
    font-family: inherit; font-size: 0.95rem; font-weight: 800;
    cursor: pointer; transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn small { font-size: 0.65rem; font-weight: 600; opacity: 0.8; }
  .btn-gen { background: var(--accent); color: white; }
  .btn-sell { background: linear-gradient(135deg, var(--gold), #b8860b); color: #2d1b00; }
  
  /* Новая кнопка обмена на главном экране */
  .btn-trade-main {
    background: rgba(92,107,192,0.15); color: #8b9dff;
    border: 1px solid rgba(92,107,192,0.3);
    width: 100%; max-width: 400px; padding: 12px;
    margin-top: -10px; border-radius: 14px; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; font-family: inherit; transition: 0.2s;
  }
  .btn-trade-main:active { background: rgba(92,107,192,0.25); }

  /* Нижняя навигация */
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 10px 25px; gap: 8px;
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .nav-btn {
    background: transparent; border: none; border-radius: 14px;
    padding: 10px 20px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--text-dim); transition: all 0.2s; flex: 1; font-family: inherit;
    position: relative;
  }
  .nav-btn.active { background: var(--bg-card); color: var(--text); }
  .nav-icon { font-size: 1.4rem; }
  .nav-label { font-size: 0.7rem; font-weight: 600; }
  .nav-badge {
    position: absolute; top: 2px; right: 15px;
    background: var(--danger); color: white;
    border-radius: 10px; min-width: 16px; height: 16px; padding: 0 4px;
    font-size: 0.6rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }

  /* Модалки */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    background: var(--bg-card); border-radius: 24px 24px 0 0;
    width: 100%; max-width: 500px; max-height: 85vh;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: #333; border-radius: 2px; margin: 12px auto 0; }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-size: 1.1rem; font-weight: 800; }
  .close-x {
    background: var(--bg); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-body { padding: 16px 20px 30px; overflow-y: auto; flex: 1; }
  .sheet-body::-webkit-scrollbar { width: 4px; }
  .sheet-body::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  /* Инвентарь */
  .empty-state { text-align: center; padding: 40px; color: var(--text-dim); }
  .inv-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .inv-info { flex: 1; }
  .inv-plate { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.1rem; display: flex; gap: 6px; align-items: center; }
  .inv-region { font-size: 0.7rem; background: var(--border); padding: 2px 6px; border-radius: 4px; color: var(--text-dim); }
  .inv-meta { display: flex; gap: 8px; margin-top: 4px; align-items: center; font-size: 0.75rem; }
  .inv-price { color: var(--gold); font-weight: 700; }
  .inv-actions { display: flex; gap: 6px; }
  
  .inv-btn {
    background: var(--bg-card-hover); border: none; color: var(--text);
    padding: 8px 12px; border-radius: 10px; font-weight: 700;
    cursor: pointer; font-size: 0.8rem; font-family: inherit; transition: 0.2s;
  }
  .inv-btn.sell { background: linear-gradient(135deg, var(--gold), #b8860b); color: #2d1b00; }
  .inv-btn.trade { background: rgba(92,107,192,0.2); color: #8b9dff; border: 1px solid rgba(92,107,192,0.4); }

  /* Обмен */
  .trade-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; text-align: center;
  }
  .trade-link-input {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 14px; border-radius: 12px;
    font-family: inherit; font-size: 0.9rem; outline: none;
    margin: 15px 0; word-break: break-all;
  }
  .trade-link-input:focus { border-color: var(--accent); }

  /* Тосты */
  .toast-container {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 300; display: flex; flex-direction: column; gap: 6px;
    align-items: center; pointer-events: none; width: 90%; max-width: 400px;
  }
  .toast {
    background: var(--bg-card); color: var(--text); padding: 12px 20px;
    border-radius: 12px; font-weight: 700; font-size: 0.85rem;
    border: 1px solid var(--border); animation: toastIn 0.3s ease;
  }
  .toast.success { background: #1a3a1a; border-color: var(--success); color: var(--success); }
  .toast.error { background: #3a1a1a; border-color: var(--danger); color: var(--danger); }
  @keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* Анимации */
  @keyframes blurSpin { 0%, 100% { filter: blur(0); } 50% { filter: blur(8px); } }
  .spinning .plate-main { animation: blurSpin 0.1s infinite; }
  
  .flash-overlay { position: fixed; inset: 0; background: white; pointer-events: none; z-index: 100; opacity: 0; }
  .flash-overlay.active { animation: flash 0.5s ease; }
  @keyframes flash { 0% { opacity: 0; } 50% { opacity: 0.3; } 100% { opacity: 0; } }

  @media (max-width: 380px) {
    .plate-main { font-size: 3rem; padding: 0 15px; }
    .plate { height: 85px; min-width: 260px; }
    .region-num { font-size: 1.8rem; }
    .plate-region { width: 65px; }
  }
</style>
</head>
<body>

<div id="appScreen">
  <!-- Верхняя панель -->
  <div class="top-bar">
    <div class="balance-pill" id="balancePill">
      <span>💎</span>
      <span id="balance">10 000</span>
    </div>
    <div class="top-buttons">
      <button class="icon-btn" onclick="openModal('settings')" title="Настройки">⚙️</button>
    </div>
  </div>

  <!-- Основная зона -->
  <div class="main-area">
    <!-- Редкость -->
    <div class="rarity-badge common" id="rarityBadge">
      <span id="rarityIcon">⚪</span>
      <span id="rarityText">Обычный</span>
    </div>

    <!-- Номер -->
    <div class="plate-scene">
      <div class="plate-wrap" id="plateWrap">
        <div class="plate">
          <div class="plate-main" id="plateText">А001АА</div>
          <div class="plate-region">
            <div class="region-num" id="regionNum">77</div>
            <div class="region-label">
              RUS
              <div class="flag">
                <div style="background:#fff;"></div>
                <div style="background:#0039a6;"></div>
                <div style="background:#d52b1e;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Стоимость -->
    <div>
      <div class="value-label">Стоимость</div>
      <div class="value-display" id="valueDisplay">0 ₽</div>
    </div>

    <!-- Кнопки действий -->
    <div class="actions">
      <button class="btn btn-gen" id="spinBtn">
        <span>🎰 Крутить</span>
        <small id="spinCost">-100 ₽</small>
      </button>
      <button class="btn btn-sell" id="sellBtn" disabled>
        <span>💰 Продать</span>
        <small id="sellPrice">—</small>
      </button>
    </div>

    <!-- Кнопка обмена (вынесена на главный экран) -->
    <button class="btn-trade-main" id="tradeMainBtn" onclick="openTrade(state.current?.id)" style="display:none;">
      🤝 Обменять этот номер по ссылке
    </button>
  </div>

  <!-- Нижняя панель -->
  <div class="bottom-nav">
    <button class="nav-btn" data-tab="inventory">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Склад</span>
      <span class="nav-badge" id="invBadge" style="display:none;">0</span>
    </button>
    <button class="nav-btn" data-tab="trade">
      <span class="nav-icon">🤝</span>
      <span class="nav-label">Обмен</span>
    </button>
    <button class="nav-btn" data-tab="stats">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Статы</span>
    </button>
  </div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="modal">
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="modalTitle">Склад</div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>

<div class="flash-overlay" id="flashOverlay"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ================= ДАННЫЕ =================
const LETTERS = "АВЕКМНОРСТУХ";
const REGIONS = ["77", "99", "97", "177", "199", "197", "50", "150", "190", "750", "46", "23", "161", "61", "777", "799"];
const GEN_COST = 100;
const SAVE_KEY = 'plate_gen_save_v1';

const RARITIES = {
  common:    { name: "Обычный",      icon: "⚪", multiplier: 1 },
  rare:      { name: "Редкий",        icon: "🔵", multiplier: 3 },
  epic:      { name: "Эпический",     icon: "🟣", multiplier: 8 },
  legendary: { name: "Легендарный",   icon: "🟡", multiplier: 25 },
  mythic:    { name: "Мифический",    icon: "🔴", multiplier: 100 }
};

// ================= СОСТОЯНИЕ =================
let state = {
  balance: 10000,
  current: null,
  inventory: [],
  stats: { generated: 0, sold: 0, earned: 0 }
};

// ================= СОХРАНЕНИЕ =================
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadGame() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
}

// ================= УТИЛИТЫ =================
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const randLetter = () => LETTERS[Math.floor(Math.random() * LETTERS.length)];
const formatMoney = (val) => Math.floor(val).toLocaleString('ru-RU');
const $ = (id) => document.getElementById(id);

// Генерация уникального кода обмена
function generateTradeCode(text, region, price) {
  const payload = `${text}|${region}|${price}`;
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  return b64.replace(/=/g, ''); 
}
function parseTradeCode(code) {
  try {
    const b64 = code + '=='.slice(0, (4 - code.length % 4) % 4);
    const decoded = decodeURIComponent(escape(atob(b64)));
    const [text, region, price] = decoded.split('|');
    return { text, region, price: parseInt(price) };
  } catch(e) { return null; }
}

// ================= ЛОГИКА =================
function evaluateNumber(text) {
  const digits = text.replace(/\D/g, '');
  const letters = text.replace(/[^А-Я]/g, '');
  
  const isTriple = /(\d)\1\1/.test(digits);
  const isMirror = digits.length >= 3 && digits[0] === digits[digits.length - 1] && !isTriple;
  const isLow = parseInt(digits) < 100 && digits.length > 0;
  const isRepeatedLetters = /(.)\1/.test(letters);
  
  let rarity = 'common';
  let basePrice = rand(500, 1500);

  if (isTriple) { rarity = 'legendary'; basePrice = rand(50000, 150000); }
  else if (isMirror) { rarity = 'epic'; basePrice = rand(8000, 25000); }
  else if (isLow) { rarity = 'epic'; basePrice = rand(5000, 15000); }
  else if (isRepeatedLetters) { rarity = 'rare'; basePrice = rand(2000, 6000); }
  else {
    const roll = Math.random();
    if (roll < 0.01) { rarity = 'mythic'; basePrice = rand(500000, 1500000); }
    else if (roll < 0.05) { rarity = 'legendary'; basePrice = rand(50000, 150000); }
    else if (roll < 0.15) { rarity = 'epic'; basePrice = rand(8000, 25000); }
    else if (roll < 0.40) { rarity = 'rare'; basePrice = rand(2000, 6000); }
  }

  const totalPrice = Math.floor(basePrice * RARITIES[rarity].multiplier * 0.5);
  return { rarity, price: totalPrice };
}

function generatePlate() {
  const text = `${randLetter()}${rand(0,9)}${rand(0,9)}${rand(0,9)}${randLetter()}${randLetter()}`;
  const region = pick(REGIONS);
  const evalResult = evaluateNumber(text);
  return {
    id: Date.now() + Math.random(),
    text,
    region,
    rarity: evalResult.rarity,
    price: evalResult.price
  };
}

// ================= UI =================
function updateUI() {
  $('balance').textContent = formatMoney(state.balance);
  $('invBadge').textContent = state.inventory.length;
  $('invBadge').style.display = state.inventory.length > 0 ? 'flex' : 'none';
  $('spinBtn').disabled = state.balance < GEN_COST;

  if (state.current) {
    const c = state.current;
    $('plateText').textContent = c.text;
    $('regionNum').textContent = c.region;
    
    const r = RARITIES[c.rarity];
    $('rarityBadge').className = 'rarity-badge ' + c.rarity;
    $('rarityIcon').textContent = r.icon;
    $('rarityText').textContent = r.name;
    $('valueDisplay').textContent = formatMoney(c.price) + ' ₽';
    
    $('sellBtn').disabled = false;
    $('sellPrice').textContent = `+${formatMoney(c.price)} ₽`;
    $('tradeMainBtn').style.display = 'block';
  } else {
    $('sellBtn').disabled = true;
    $('sellPrice').textContent = '—';
    $('tradeMainBtn').style.display = 'none';
  }
  
  saveGame();
}

function flashBalance() {
  $('balancePill').classList.add('flash');
  setTimeout(() => $('balancePill').classList.remove('flash'), 300);
}

// ================= АНИМАЦИЯ ПРОКРУТКИ =================
let isSpinning = false;
function spin() {
  if (isSpinning || state.balance < GEN_COST) return;
  isSpinning = true;
  state.balance -= GEN_COST;
  updateUI();
  
  const wrap = $('plateWrap');
  wrap.classList.add('spinning');
  $('spinBtn').disabled = true;
  $('sellBtn').disabled = true;
  $('tradeMainBtn').style.display = 'none';

  const finalPlate = generatePlate();
  
  let ticks = 0;
  const totalTicks = 15;
  
  const interval = setInterval(() => {
    $('plateText').textContent = `${randLetter()}${rand(0,9)}${rand(0,9)}${rand(0,9)}${randLetter()}${randLetter()}`;
    $('regionNum').textContent = pick(REGIONS);
    
    ticks++;
    if (ticks >= totalTicks) {
      clearInterval(interval);
      finishSpin(finalPlate);
    }
  }, 50);
}

function finishSpin(plate) {
  state.current = plate;
  state.stats.generated++;
  state.inventory.unshift(plate);
  
  updateUI();
  
  const r = RARITIES[plate.rarity];
  if (plate.rarity === 'legendary' || plate.rarity === 'mythic') {
    $('flashOverlay').classList.add('active');
    setTimeout(() => $('flashOverlay').classList.remove('active'), 500);
    toast(`${r.icon} ${r.name} номер!`, 'success');
  } else if (plate.rarity === 'epic') {
    toast(`${r.icon} Эпический номер!`, 'success');
  }
  
  setTimeout(() => {
    $('plateWrap').classList.remove('spinning');
    isSpinning = false;
    updateUI();
  }, 100);
}

// ================= ПРОДАЖА =================
function sellCurrent() {
  if (!state.current) return;
  const c = state.current;
  state.balance += c.price;
  state.stats.sold++;
  state.stats.earned += c.price;
  state.inventory = state.inventory.filter(i => i.id !== c.id);
  state.current = null;
  
  flashBalance();
  toast(`+${formatMoney(c.price)} ₽`, 'success');
  updateUI();
}

// ================= УВЕДОМЛЕНИЯ =================
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('toastContainer').appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(() => t.remove(), 300);
  }, 2000);
}

// ================= МОДАЛКИ =================
function openModal(tab) {
  $('modal').classList.add('open');
  
  if (tab === 'inventory') {
    $('modalTitle').textContent = '📦 Склад';
    renderInventory();
  } else if (tab === 'settings') {
    $('modalTitle').textContent = '⚙️ Настройки';
    renderSettings();
  } else if (tab === 'stats') {
    $('modalTitle').textContent = '📊 Статистика';
    renderStats();
  } else if (tab === 'trade') {
    $('modalTitle').textContent = '🤝 Обмен номерами';
    renderTrade();
  }
}

function closeModal() {
  $('modal').classList.remove('open');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
}

// ================= РЕНДЕР ИНВЕНТАРЯ =================
function renderInventory() {
  const body = $('modalBody');
  
  if (state.inventory.length === 0) {
    body.innerHTML = `<div class="empty-state">Склад пуст. Крути номера!</div>`;
    return;
  }
  
  body.innerHTML = state.inventory.map(item => {
    const r = RARITIES[item.rarity];
    return `
      <div class="inv-item">
        <div class="inv-info">
          <div class="inv-plate">${item.text} <span class="inv-region">${item.region}</span></div>
          <div class="inv-meta">
            <span style="color:var(--text-dim);">${r.icon} ${r.name}</span>
            <span class="inv-price">${formatMoney(item.price)} ₽</span>
          </div>
        </div>
        <div class="inv-actions">
          <button class="inv-btn trade" onclick="openTrade(${item.id})">🤝</button>
          <button class="inv-btn sell" onclick="sellFromInv(${item.id})">Продать</button>
        </div>
      </div>
    `;
  }).join('');
}

function sellFromInv(id) {
  const idx = state.inventory.findIndex(i => i.id === id);
  if (idx === -1) return;
  const item = state.inventory[idx];
  state.balance += item.price;
  state.stats.sold++;
  state.stats.earned += item.price;
  state.inventory.splice(idx, 1);
  if (state.current && state.current.id === id) state.current = null;
  
  flashBalance();
  toast(`+${formatMoney(item.price)} ₽`, 'success');
  updateUI();
  renderInventory();
}

// ================= СИСТЕМА ОБМЕНА =================
let tradeItemId = null;

function openTrade(id) {
  if (!id) { toast('Нет номера для обмена', 'error'); return; }
  tradeItemId = id;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="trade"]').classList.add('active');
  openModal('trade');
}

function renderTrade() {
  const body = $('modalBody');
  
  if (tradeItemId) {
    // Экран создания ссылки
    const item = state.inventory.find(i => i.id === tradeItemId);
    if (!item) { tradeItemId = null; renderTrade(); return; }
    
    const code = generateTradeCode(item.text, item.region, item.price);
    // Ссылка будет работать на том же домене, где открыта игра
    const url = `${window.location.origin}${window.location.pathname}?trade=${code}`;
    
    body.innerHTML = `
      <div class="trade-box">
        <div style="font-size:1.2rem;font-weight:800;margin-bottom:5px;">${item.text} <span style="font-size:0.8rem;color:var(--text-dim);">${item.region}</span></div>
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:15px;">Стоимость: ${formatMoney(item.price)} ₽</div>
        
        <div style="font-size:0.8rem;margin-bottom:5px;text-align:left;">Ссылка для друга:</div>
        <input type="text" class="trade-link-input" id="tradeLinkInput" value="${url}" readonly onclick="this.select()">
        
        <div style="display:flex;gap:10px;">
          <button class="inv-btn" style="flex:1;padding:14px;background:var(--accent);color:white;" onclick="copyTradeLink()">📋 Скопировать</button>
          <button class="inv-btn" style="flex:1;padding:14px;background:var(--danger);color:white;" onclick="cancelTrade()">Отмена</button>
        </div>
        
        <div style="font-size:0.7rem;color:var(--text-dim);margin-top:20px;line-height:1.4;">
          Внимание: после нажатия "Скопировать" номер <b>удалится из твоего инвентаря</b> и будет ждать, пока друг перейдет по ссылке.
        </div>
      </div>
    `;
  } else {
    // Экран ввода кода (если игрок хочет принять обмен вручную)
    body.innerHTML = `
      <div class="trade-box">
        <div style="font-size:1.2rem;font-weight:800;margin-bottom:15px;">Принять обмен</div>
        <div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:5px;text-align:left;">Вставь ссылку или код:</div>
        <input type="text" class="trade-link-input" id="tradeInput" placeholder="Вставь ссылку сюда...">
        <button class="inv-btn" style="width:100%;padding:14px;background:var(--accent);color:white;" onclick="receiveTrade()">🎁 Получить номер</button>
      </div>
    `;
  }
}

function copyTradeLink() {
  const input = $('tradeLinkInput');
  input.select();
  document.execCommand('copy');
  toast('Ссылка скопирована!', 'success');
  
  // Удаляем номер из своего инвентаря (он "передан" другу)
  const idx = state.inventory.findIndex(i => i.id === tradeItemId);
  if (idx !== -1) {
    state.inventory.splice(idx, 1);
    if (state.current && state.current.id === tradeItemId) state.current = null;
  }
  tradeItemId = null;
  updateUI();
  setTimeout(() => closeModal(), 1000);
}

function cancelTrade() {
  tradeItemId = null;
  closeModal();
}

function receiveTrade() {
  const input = $('tradeInput').value.trim();
  if (!input) return;
  
  let code = input;
  // Если вставили полную ссылку — вытаскиваем код
  if (input.includes('?trade=')) {
    code = input.split('?trade=')[1];
  }
  
  const parsed = parseTradeCode(code);
  if (!parsed) {
    toast('Неверный код или ссылка', 'error');
    return;
  }
  
  const newPlate = {
    id: Date.now() + Math.random(),
    text: parsed.text,
    region: parsed.region,
    price: parsed.price,
    rarity: evaluateNumber(parsed.text).rarity
  };
  
  state.inventory.unshift(newPlate);
  state.current = newPlate;
  state.stats.generated++;
  
  updateUI();
  toast('Номер получен!', 'success');
  closeModal();
}

// ================= АВТО-ПРИЕМ ОБМЕНА ИЗ ССЫЛКИ =================
function checkTradeUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('trade');
  if (code) {
    const parsed = parseTradeCode(code);
    if (parsed) {
      setTimeout(() => {
        const newPlate = {
          id: Date.now() + Math.random(),
          text: parsed.text,
          region: parsed.region,
          price: parsed.price,
          rarity: evaluateNumber(parsed.text).rarity
        };
        state.inventory.unshift(newPlate);
        state.current = newPlate;
        state.stats.generated++;
        updateUI();
        toast(`🎁 Получен номер: ${parsed.text}`, 'success');
        window.history.replaceState({}, document.title, window.location.pathname);
      }, 300);
    }
  }
}

// ================= СТАТИСТИКА =================
function renderStats() {
  const s = state.stats;
  $('modalBody').innerHTML = `
    <div style="display:grid;gap:12px;">
      <div style="background:var(--bg);border-radius:12px;padding:16px;">
        <div style="font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;">Сгенерировано</div>
        <div style="font-size:1.8rem;font-weight:800;">${s.generated}</div>
      </div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;">
        <div style="font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;">Продано</div>
        <div style="font-size:1.8rem;font-weight:800;">${s.sold}</div>
      </div>
      <div style="background:var(--bg);border-radius:12px;padding:16px;">
        <div style="font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;">Всего заработано</div>
        <div style="font-size:1.8rem;font-weight:800;color:var(--gold);">${formatMoney(s.earned)} ₽</div>
      </div>
    </div>
  `;
}

// ================= НАСТРОЙКИ =================
function renderSettings() {
  $('modalBody').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <button class="inv-btn" style="padding:16px;background:var(--accent);color:white;" onclick="openModal('trade')">🤝 Принять обмен по коду</button>
      <button class="inv-btn" style="padding:16px;background:var(--danger);color:white;" onclick="resetGame()">🗑️ Сбросить прогресс</button>
      <div style="font-size:0.75rem;color:var(--text-dim);text-align:center;margin-top:10px;">
        Прогресс сохраняется автоматически в браузере.
      </div>
    </div>
  `;
}

function resetGame() {
  if (!confirm('Точно сбросить весь прогресс?')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

// ================= ОБРАБОТЧИКИ =================
$('spinBtn').addEventListener('click', spin);
$('sellBtn').addEventListener('click', sellCurrent);
$('plateWrap').addEventListener('click', () => { if (!isSpinning) spin(); });

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    openModal(btn.dataset.tab);
  });
});

$('modal').addEventListener('click', (e) => {
  if (e.target === $('modal')) closeModal();
});

// ================= ИНИЦИАЛИЗАЦИЯ =================
loadGame();

if (!state.current && state.inventory.length === 0) {
  const start = generatePlate();
  state.current = start;
  state.inventory.unshift(start);
} else if (state.inventory.length > 0 && !state.current) {
  state.current = state.inventory[0];
}

updateUI();
checkTradeUrl();
</script>
</body>
</html>
