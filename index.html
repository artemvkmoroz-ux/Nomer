<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8f9fa">
<title>Nomerix (Best)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. ГЛОБАЛЬНЫЕ СТИЛИ
   ============================================================ */
:root {
    --bg: #f8f9fa;
    --panel-bg: #ffffff;
    --text: #000000;
    --sub: #8e8e93;
    --border: #e5e5ea;
    --shadow: 0 2px 10px rgba(0,0,0,0.05);
    --gold: #d4af37;
    --sb: env(safe-area-inset-bottom, 0px);
    --st: env(safe-area-inset-top, 0px);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
}

/* ============================================================
   2. ВЕРХНЯЯ ПАНЕЛЬ
   ============================================================ */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: calc(16px + var(--st)) 20px 16px;
    z-index: 100;
}

.balances {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-left: auto;
}

.bal-box {
    background: var(--panel-bg);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: var(--shadow);
}

.icon-btn {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
}

/* ============================================================
   3. ГЛАВНЫЙ ЭКРАН
   ============================================================ */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
}

.status-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
}

.rarity-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.rarity-name {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #333;
}

.dots {
    display: flex;
    gap: 3px;
}

.dot {
    width: 8px;
    height: 4px;
    border-radius: 2px;
    background: #e5e5ea;
    transition: background 0.3s;
}

.price-tag {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
}

/* ============================================================
   4. ИДЕАЛЬНЫЙ НОМЕР (ЗАЩИЩЕН ОТ СПЛЮЩИВАНИЯ)
   ============================================================ */
.plate-zone {
    width: 100%;
    display: flex;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 24px;
    flex-shrink: 0;
}

.plate-zone:active {
    transform: scale(0.97);
}

.plate {
    display: flex;
    background: linear-gradient(180deg, #ffffff 0%, #e8e8e8 40%, #d1d1d1 100%);
    border-radius: 6px;
    overflow: hidden;
    height: 95px;
    min-height: 95px;
    max-height: 95px;
    width: 100%;
    max-width: 380px;
    flex-shrink: 0;
    border: 2px solid #222;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,1);
    position: relative;
    font-family: 'Arial Black', Impact, sans-serif;
}

.plate-main {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
}

.reels {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    will-change: transform;
}

.reel {
    height: 95px;
    min-height: 95px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial Black', Impact, sans-serif;
    font-size: 56px;
    letter-spacing: 1px;
    white-space: nowrap;
    color: #111;
    text-shadow: 1px 1px 1px rgba(255,255,255,0.6);
}

.plate-side {
    width: 82px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-left: 2px solid #222;
    flex-shrink: 0;
}

.region {
    font-family: 'Arial Black', Impact, sans-serif;
    font-size: 34px;
    line-height: 1;
    color: #111;
    margin-top: -2px;
}

.flag-box {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
}

.rus-text {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    font-weight: 900;
    color: #111;
}

.flag-icon {
    width: 20px;
    height: 13px;
    display: flex;
    flex-direction: column;
    border: 1px solid #111;
}

.flag-white { flex: 1; background: #fff; }
.flag-blue { flex: 1; background: #0039a6; }
.flag-red { flex: 1; background: #d52b1e; }

.description {
    font-size: 13px;
    color: var(--sub);
    font-weight: 600;
    text-align: center;
    margin-bottom: 40px;
}

/* ============================================================
   5. НИЖНИЕ КНОПКИ
   ============================================================ */
.bottom-controls {
    position: absolute;
    bottom: calc(20px + var(--sb));
    width: 100%;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
}

.bottom-btn {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow);
}

/* ============================================================
   6. ЭКРАНЫ
   ============================================================ */
.screen {
    display: none;
    flex-direction: column;
    height: 100%;
    background: var(--bg);
    position: absolute;
    inset: 0;
    z-index: 200;
    overflow-y: auto;
}

.screen.active {
    display: flex;
    animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.scr-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: calc(16px + var(--st)) 20px 16px;
    font-size: 18px;
    font-weight: 800;
    position: sticky;
    top: 0;
    background: rgba(248,249,250,0.95);
    backdrop-filter: blur(10px);
    z-index: 10;
    border-bottom: 1px solid var(--border);
}

.menu-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
}

.menu-card {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-size: 16px;
    font-weight: 700;
}

.menu-ico {
    font-size: 24px;
}

.list-item {
    background: #fff;
    border: 1px solid #e5e5ea;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.toast {
    position: fixed;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    z-index: 10000;
    transition: top 0.3s;
}

.toast.show {
    top: 40px;
}
</style>
</head>
<body>

<div id="app">
  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="game" style="height:100%;display:flex;flex-direction:column">
    <div class="top-bar">
      <button class="icon-btn" onclick="UI.open('menu')">☰</button>
      <div class="balances">
        <div class="bal-box" id="money">0 ₽</div>
        <div class="bal-box" id="bitcoin" style="font-size:11px; color:#8e8e93;">0 ₿</div>
      </div>
    </div>

    <div class="main">
      <div class="status-bar">
        <div class="rarity-info">
          <div class="rarity-name" id="rarity-name">ОБЫЧНЫЙ</div>
          <div class="dots" id="dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
        <div class="price-tag" id="price">0 ₽</div>
      </div>

      <div class="plate-zone" onclick="Game.spin()">
        <div class="plate" id="plate">
          <div class="plate-main">
            <div class="reels" id="reels">
              <div class="reel">А 000 АА</div>
            </div>
          </div>
          <div class="plate-side" id="side">
            <div class="region" id="region">77</div>
            <div class="flag-box">
              <span class="rus-text">RUS</span>
              <div class="flag-icon">
                <div class="flag-white"></div>
                <div class="flag-blue"></div>
                <div class="flag-red"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="description" id="description">Коснись номера, чтобы крутить</div>
    </div>

    <div class="bottom-controls">
      <div class="bottom-btn"><span>🇷🇺</span> Россия 5 типов</div>
      <div class="bottom-btn">Авто 1/с</div>
    </div>
  </div>

  <!-- МЕНЮ -->
  <div id="scr-menu" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('menu')">←</button><span>МЕНЮ</span></div>
    <div class="menu-grid">
      <div class="menu-card" onclick="UI.open('inventory')"><div class="menu-ico">📦</div><div>Инвентарь</div></div>
      <div class="menu-card" onclick="UI.open('shop')"><div class="menu-ico">⚡</div><div>Бусты (за ₿)</div></div>
      <div class="menu-card" onclick="UI.open('settings')"><div class="menu-ico">⚙️</div><div>Настройки</div></div>
    </div>
  </div>

  <!-- ИНВЕНТАРЬ -->
  <div id="scr-inventory" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('inventory')">←</button><span>ИНВЕНТАРЬ</span></div>
    <div id="inv-list" style="padding:20px;"></div>
  </div>

  <!-- МАГАЗИН -->
  <div id="scr-shop" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('shop')">←</button><span>БУСТЫ</span></div>
    <div id="shop-content" style="padding:20px;"></div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div id="scr-settings" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('settings')">←</button><span>НАСТРОЙКИ</span></div>
    <div id="settings-content" style="padding:20px;"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

// ==========================================
// 1. КОНФИГ
// ==========================================
const CFG = { COST: 5000, START: 500000, KEY: 'nomerix_best_v1' };
const RARITIES = [
  { lvl:1, name:'МУСОР',        color:'#475569', chance:14.0, min:500,       max:5000 },
  { lvl:2, name:'ОБЫЧНЫЙ',      color:'#94a3b8', chance:35.0, min:15000,     max:80000 },
  { lvl:3, name:'НЕОБЫЧНЫЙ',    color:'#10b981', chance:25.0, min:100000,    max:500000 },
  { lvl:4, name:'РЕДКИЙ',       color:'#3b82f6', chance:15.0, min:1000000,   max:5000000 },
  { lvl:5, name:'ЭПИЧЕСКИЙ',    color:'#a855f7', chance:7.0,  min:5000000,   max:15000000 },
  { lvl:6, name:'ЛЕГЕНДАРНЫЙ',  color:'#f59e0b', chance:2.5,  min:15000000,  max:50000000 },
  { lvl:7, name:'БЛАТНОЙ',      color:'#ef4444', chance:1.0,  min:50000000,  max:200000000 },
  { lvl:8, name:'БОЖЕСТВЕННЫЙ', color:'#ec4899', chance:0.5,  min:200000000, max:1000000000 },
];
const BOOSTS = [
  { id: 'multiplier', name: '💎 Множитель цены', desc: 'Все номера стоят в 2 раза дороже', basePrice: 1, maxLvl: 5 }, 
  { id: 'lucky', name: '🍀 Удача', desc: '+10% к шансу редких', basePrice: 1.5, maxLvl: 5 }, 
  { id: 'discount', name: '🎟 Скидка', desc: 'Спин -10%', basePrice: 0.5, maxLvl: 5 },
];

// ==========================================
// 2. УТИЛИТЫ
// ==========================================
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function fmtRub(n) {
  if (n === 0) return '0 ₽';
  const abs = Math.abs(n);
  if (abs < 1000) return Math.floor(n) + ' ₽';
  if (abs < 1_000_000) return (n / 1000).toFixed(1).replace('.0', '') + 'K ₽';
  if (abs < 1_000_000_000) return (n / 1_000_000).toFixed(1).replace('.0', '') + 'M ₽';
  if (abs < 1_000_000_000_000) return (n / 1_000_000_000).toFixed(1).replace('.0', '') + 'МЛРД ₽';
  return (n / 1_000_000_000_000).toFixed(1).replace('.0', '') + 'ТРЛН ₽';
}
const fmtBtc = n => n === 0 ? '0 ₿' : (Math.round(n * 100) / 100).toLocaleString('ru-RU') + ' ₿';

// ==========================================
// 3. ГЕНЕРАТОР НОМЕРОВ
// ==========================================
const RU_LETTERS = 'АВЕКМНОРСТУХ';
const BEAUTY_TOP = ['А','О','Е','К','М','С','Н','Т'];
const BEAUTY_DIGITS = {
  uncommon: ['001','100','777','007','111','222','999'],
  rare:     ['001','777','888','999','123','456','789','555','333'],
  epic:     ['001','007','777','888','999','123','456','555'],
  legend:   ['001','777','888','999','100','555'],
  elite:    ['001','007','777','888','999','555'],
  god:      ['001','007','777','111','222','333'],
};
const MIRROR = ['010','020','101','111','121','131','202','212','303','313','404','505','606','707','808','909','999','777','555'];
const PREMIUM_REGIONS = ['77','99','97','78','98','177','199','197','178','198'];
const GOOD_REGIONS = [...PREMIUM_REGIONS, '50','90','150','750','790','47','23','61','34','36','16','02','52','63','64','66','72','74','86','89'];

function pickLetter(pool = RU_LETTERS) { return pool[rnd(pool.length)]; }
function pickBeautyLetter() { return pick(BEAUTY_TOP); }
function randomDigits3() { return String(rnd(1000)).padStart(3, '0'); }

function genRu(tier) {
  let firstLetter, lastLetters, digits, region, beauty = false;
  switch(tier) {
    case 'trash': digits = randomDigits3(); firstLetter = pickLetter(); lastLetters = pickLetter() + pickLetter(); region = String(150 + rnd(50)); break;
    case 'common': if (Math.random() < 0.1) { digits = pick(BEAUTY_DIGITS.uncommon); beauty = true; } else { digits = randomDigits3(); } firstLetter = pickLetter(); lastLetters = pickLetter() + pickLetter(); region = String(30 + rnd(120)); break;
    case 'uncommon': if (Math.random() < 0.5) { digits = pick(BEAUTY_DIGITS.uncommon); firstLetter = pickLetter(); } else { firstLetter = pickBeautyLetter(); digits = randomDigits3(); } lastLetters = pickLetter() + pickLetter(); region = pick(GOOD_REGIONS); beauty = true; break;
    case 'rare': digits = Math.random() < 0.6 ? pick(BEAUTY_DIGITS.rare) : pick(MIRROR); firstLetter = pickBeautyLetter(); lastLetters = pickLetter() + pickLetter(); region = pick(PREMIUM_REGIONS); beauty = true; break;
    case 'epic': firstLetter = pickBeautyLetter(); lastLetters = firstLetter + (Math.random() < 0.6 ? firstLetter : pickBeautyLetter()); digits = pick(BEAUTY_DIGITS.epic); region = pick(['77','99','97','78','98']); beauty = true; break;
    case 'legend': firstLetter = pickBeautyLetter(); lastLetters = firstLetter + firstLetter; digits = pick(BEAUTY_DIGITS.legend); region = pick(['77','99','97']); beauty = true; break;
    case 'elite': firstLetter = pick(['О','Е','К','М','С','А','Т','Н']); lastLetters = Math.random() < 0.5 ? (pick(['О','Е','К','М','С']) + pick(['О','Е','К','М','С'])) : (pickBeautyLetter() + pickBeautyLetter()); digits = pick(['001','007','777','888','100','200','300','500','999']); region = '77'; beauty = true; break;
    case 'god': firstLetter = pick(['О','А','Е','К','С','М','Т','Н']); lastLetters = firstLetter + firstLetter; digits = pick(['001','007','777','111','222','333']); region = '77'; beauty = true; break;
  }
  return { text: `${firstLetter} ${digits} ${lastLetters}`, region, beauty };
}
function genPlate(rarity) { if (!rarity) rarity = RARITIES[1]; return genRu(rarity.tier || 'common'); }

// ==========================================
// 4. СОСТОЯНИЕ И СОХРАНЕНИЯ
// ==========================================
let State = {
  money: CFG.START, bitcoin: 0, inventory: [], maxRecord: 0, spinning: false, boosts: {}
};

function saveGame() { localStorage.setItem(CFG.KEY, JSON.stringify(State)); }
function loadGame() { 
  const raw = localStorage.getItem(CFG.KEY); 
  if (raw) { try { State = JSON.parse(raw); State.spinning = false; } catch(e){} } 
}

// ==========================================
// 5. UI ЛОГИКА
// ==========================================
const UI = {
  els: {},
  init() {
    ['money','bitcoin','reels','region','price','rarity-name','dots','description','inv-list','shop-content','settings-content'].forEach(id => this.els[id] = $(id));
  },
  update() {
    this.els.money.textContent = fmtRub(State.money);
    this.els.bitcoin.textContent = fmtBtc(State.bitcoin);
    const cost = Math.floor(CFG.COST * (1 - (State.boosts.discount || 0) * 0.1));
    if (State.money < cost && !State.spinning) {
      this.els.description.textContent = 'НЕ ХВАТАЕТ ДЕНЕГ';
      this.els.description.style.color = '#ff3b30';
    } else if (!State.spinning) {
      this.els.description.textContent = 'Коснись номера, чтобы крутить';
      this.els.description.style.color = '#8e8e93';
    }
  },
  open(id) {
    if (State.spinning) return;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $('scr-'+id).classList.add('active');
    if (id === 'inventory') UI.renderInv();
    if (id === 'shop') UI.renderShop();
    if (id === 'settings') UI.renderSettings();
  },
  close(id) { $('scr-'+id).classList.remove('active'); UI.update(); },
  setRarity(win) {
    this.els['rarity-name'].textContent = win.name;
    this.els['rarity-name'].style.color = win.color;
    this.els.price.style.color = win.color;
    const dots = this.els.dots.children;
    for (let i = 0; i < dots.length; i++) {
      if (i < win.lvl) dots[i].style.background = win.color;
      else dots[i].style.background = '#e5e5ea';
    }
  },
  renderInv() {
    let html = '';
    if (!State.inventory.length) html = '<div style="text-align:center; color:#888; padding:20px;">Пусто</div>';
    [...State.inventory].sort((a,b) => b.price - a.price).forEach(i => {
      html += `<div class="list-item"><div><b>${i.plate} ${i.region}</b><br><span style="color:${i.color}; font-size:12px; font-weight:800;">${fmtRub(i.price)}</span></div><button onclick="Game.sell('${i.id}')" style="background:#34c759; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:700;">Продать</button></div>`;
    });
    this.els['inv-list'].innerHTML = html;
  },
  renderShop() {
    let html = '<div style="font-weight:800; margin-bottom:10px;">Улучшения за Биткоины</div>';
    BOOSTS.forEach(b => {
      const lvl = State.boosts[b.id] || 0;
      const price = b.basePrice * Math.pow(2, lvl);
      html += `<div class="list-item"><div><b>${b.name} (Ур. ${lvl}/${b.maxLvl})</b><br><span style="font-size:12px; color:#666;">${b.desc}</span><br><b>${lvl >= b.maxLvl ? 'МАКС' : fmtBtc(price)}</b></div><button onclick="Shop.buy('${b.id}')" style="background:#007aff; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:700; opacity:${(State.bitcoin >= price && lvl < b.maxLvl) ? 1 : 0.5};">Купить</button></div>`;
    });
    this.els['shop-content'].innerHTML = html;
  },
  renderSettings() {
    this.els['settings-content'].innerHTML = `
      <div style="font-weight:800; margin-bottom:10px;">Промокод</div>
      <input type="text" id="promo" placeholder="ВВЕДИ КОД" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; margin-bottom:10px;">

    `;
  }
};

// 6. ИГРА
// ==========================================
function rollRarity() {
  let chances = RARITIES.map(r => r.chance);
  if (State.boosts.lucky) chances = chances.map((c, i) => Math.max(0, c + (i >= 3 ? State.boosts.lucky : -State.boosts.lucky/2)));
  let total = chances.reduce((a,b) => a+b, 0);
  let r = Math.random() * total, cum = 0;
  for (let i=0; i<RARITIES.length; i++) { cum += chances[i]; if (r <= cum) return RARITIES[i]; }
  return RARITIES[1];
}

const Game = {
  spin() {
    const cost = Math.floor(CFG.COST * (1 - (State.boosts.discount || 0) * 0.1));
    if (State.spinning || State.money < cost) return;
    
    State.spinning = true; State.money -= cost;
    UI.update(); 

    const win = rollRarity();
    const generated = genPlate(win);
    const finalPrice = Math.floor((rnd(win.max - win.min) + win.min) * (generated.beauty ? 1.3 : 1.0) * Math.pow(2, State.boosts.multiplier || 0));

    UI.els['rarity-name'].textContent = 'КРУТИМ...'; UI.els['rarity-name'].style.color = '#8e8e93';
    UI.els.price.textContent = '...'; UI.els.price.style.color = '#8e8e93';

    const reels = UI.els.reels; reels.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 20; i++) { 
      const d = document.createElement('div'); d.className = 'reel'; d.textContent = genPlate(RARITIES[1]).text; frag.appendChild(d); 
    }
    const finalDiv = document.createElement('div'); finalDiv.className = 'reel'; finalDiv.textContent = generated.text;
    frag.appendChild(finalDiv); reels.appendChild(frag);
    reels.style.transition = 'none'; reels.style.transform = 'translateY(0px)';
    
    setTimeout(() => {
      reels.style.transition = 'transform 2.5s cubic-bezier(.15,.85,.2,1)'; 
      reels.style.transform = `translateY(-1900px)`; // 20 строк * 95px = 1900
      
      let rTimer = setInterval(() => { if (UI.els.region) UI.els.region.textContent = rnd(199)+1; }, 60);
      
      setTimeout(() => {
        clearInterval(rTimer);
        if (UI.els.region) UI.els.region.textContent = generated.region;
        
        UI.setRarity(win); 
        UI.els.description.textContent = 'Номер выпал!'; 
        UI.els.price.textContent = fmtRub(finalPrice);
        
        State.inventory.push({ id: uid(), plate: generated.text, region: generated.region, price: finalPrice, color: win.color });
        if (finalPrice > State.maxRecord) State.maxRecord = finalPrice;
        
        saveGame(); State.spinning = false; UI.update();
      }, 2600);
    }, 50);
  },
  sell(id) {
    const i = State.inventory.findIndex(x => x.id === id);
    if (i >= 0) {
      State.money += State.inventory[i].price;
      State.inventory.splice(i, 1);
      UI.update(); UI.renderInv(); saveGame();
    }
  }
};

const Shop = {
  buy(id) {
    const b = BOOSTS.find(x => x.id === id);
    const lvl = State.boosts[id] || 0;
    const price = b.basePrice * Math.pow(2, lvl);
    if (State.bitcoin < price || lvl >= b.maxLvl) return;
    State.bitcoin -= price; State.boosts[id] = lvl + 1;
    UI.update(); UI.renderShop(); saveGame();
  }
};
