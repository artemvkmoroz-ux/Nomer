<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8f9fa">
<title>Nomerix (Real)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f9fa; 
  --panel-bg: #ffffff;
  --text: #000000;
  --sub: #8e8e93;
  --border: #e5e5ea;
  --shadow: 0 2px 10px rgba(0,0,0,0.05);
  --gold: #d4af37;
  --god: #a855f7;
  --elite: #ef4444;
  --sb: env(safe-area-inset-bottom, 0px);
  --st: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; }

#app { width: 100%; max-width: 430px; height: 100dvh; height: 100vh; position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

/* ВЕРХНЯЯ ПАНЕЛЬ */
.top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: calc(16px + var(--st)) 20px 16px; z-index: 100; }
.balances { display: flex; flex-direction: column; gap: 4px; margin-left: auto; }
.bal-box { background: var(--panel-bg); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); text-align: center; }
.icon-btn { background: var(--panel-bg); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }

/* ГЛАВНЫЙ ЭКРАН */
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; }

/* ПЛАШКА СТАТУСА */
.status-bar { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; box-shadow: var(--shadow); }
.rarity-info { display: flex; flex-direction: column; gap: 4px; }
.rarity-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #333; }
.dots { display: flex; gap: 3px; }
.dot { width: 8px; height: 4px; border-radius: 2px; background: #e5e5ea; }
.price-tag { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: #333; }

/* =========================================
   ИДЕАЛЬНЫЙ НОМЕР (ИСПОЛЬЗУЕМ ФОТОГРАФИЮ ПЛАСТИНЫ)
   ========================================= */
.plate-zone { width: 100%; display: flex; justify-content: center; cursor: pointer; transition: transform 0.1s; margin-bottom: 24px; }
.plate-zone:active { transform: scale(0.97); }

.plate { 
  display: flex; 
  /* Ставим фотографию реального номера как фон */
  background: url('https://i.ibb.co/3W2wXG5/plate-bg.jpg') no-repeat center center; 
  background-size: cover;
  border-radius: 6px; 
  overflow: hidden; 
  height: 100px; 
  width: 100%; 
  max-width: 380px; 
  /* Тень, чтобы номер выделялся на фоне */
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  position: relative; 
  font-family: 'Arial Black', Impact, sans-serif;
}

.plate-main { 
  flex: 1; 
  position: relative; 
  overflow: hidden; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
}

.reels { 
  position: absolute; 
  top: 0; 
  width: 100%; 
  will-change: transform; 
}

.reel { 
  height: 100px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-family: 'Arial Black', Impact, sans-serif; 
  font-size: 64px; 
  letter-spacing: 2px; 
  white-space: nowrap; 
  color: #111; 
}

/* Правая часть (Регион и флаг) */
.plate-side { 
  width: 85px; 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  /* Оставляем линию, так как она есть на фото */
  border-left: 2px solid #222; 
  padding-top: 4px;
  background: rgba(255,255,255,0.4); /* Легкая заливка, чтобы текст читался */
}

.region { 
  font-family: 'Arial Black', Impact, sans-serif; 
  font-size: 38px; 
  line-height: 1; 
  color: #111; 
  margin-top: -2px;
}

.flag-box {
  display: flex;
  align-items: center; 
  gap: 4px;
  margin-top: 2px;
}

.rus-text {
  font-family: 'Arial', sans-serif;
  font-size: 12px;
  font-weight: 900;
  color: #111;
}

.flag-icon {
  width: 22px;
  height: 14px;
  display: flex;
  flex-direction: column;
  border: 1px solid #111; 
}

.flag-white { flex: 1; background: #fff; }
.flag-blue { flex: 1; background: #0039a6; }
.flag-red { flex: 1; background: #d52b1e; }

.description { font-size: 13px; color: var(--sub); font-weight: 600; text-align: center; margin-bottom: 40px; }

/* НИЖНИЕ КНОПКИ */
.bottom-controls { position: absolute; bottom: calc(20px + var(--sb)); width: 100%; padding: 0 20px; display: flex; justify-content: space-between; }
.bottom-btn { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow); }

/* ЭКРАНЫ */
.screen { display: none; flex-direction: column; height: 100%; background: var(--bg); position: absolute; inset: 0; z-index: 200; overflow-y: auto; }
.screen.active { display: flex; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.scr-head { display: flex; align-items: center; gap: 16px; padding: calc(16px + var(--st)) 20px 16px; font-size: 18px; font-weight: 800; position: sticky; top: 0; background: rgba(248,249,250,0.9); backdrop-filter: blur(10px); z-index: 10; border-bottom: 1px solid var(--border); }
.menu-grid { display: flex; flex-direction: column; gap: 10px; padding: 20px; }
.menu-card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; box-shadow: var(--shadow); font-size: 16px; font-weight: 700; }
.menu-ico { font-size: 24px; }

.toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 10000; transition: top 0.3s; }
.toast.show { top: 40px; }
</style>
</head>

            </div>

        </div>
      </div>

      <div class="description" id="description">Коснись номера, чтобы крутить</div>
    </div>

    <div class="bottom-controls">
      <div class="bottom-btn"><span>🇷🇺</span> Россия 5 типов</div>

  <!-- МЕНЮ -->
  <div id="scr-menu" class="screen">

      <div class="menu-card" onclick="UI.open('shop')"><div class="menu-ico">⚡</div><div>Бусты (за ₿)</div></div>
      <div class="menu-card" onclick="UI.open('settings')"><div class="menu-ico">⚙️</div><div>Настройки</div></div>
    </div>
  </div>

  <!-- ИНВЕНТАРЬ -->
  <div id="scr-inventory" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('inventory')">←</button><span>ИНВЕНТАРЬ</span></div>
    <div id="inv-list" style="padding:20px; display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <!-- БУСТЫ -->
  <div id="scr-shop" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('shop')">←</button><span>БУСТЫ</span></div>
    <div id="shop-content" style="padding:20px;"></div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div id="scr-settings" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('settings')">←</button><span>НАСТРОЙКИ</span></div>
    <div style="padding:20px; display:flex; flex-direction:column; gap:16px;">
      <div class="menu-card" style="flex-direction:column; align-items:flex-start; gap:10px;">
        <div>Промокод</div>
        <input type="text" id="promo-input" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; font-size:14px;" placeholder="ВВЕДИ КОД">
        <button style="width:100%; padding:12px; background:#007aff; color:#fff; border:none; border-radius:10px; font-weight:700;" onclick="Settings.promo()">АКТИВИРОВАТЬ</button>
      </div>
      <div class="menu-card" style="flex-direction:column; align-items:flex-start; gap:10px;">
        <div>Сохранение</div>
        <button style="width:100%; padding:12px; background:#34c759; color:#fff; border:none; border-radius:10px; font-weight:700;" onclick="SaveFile.export()">📤 Экспорт</button>
        <button style="width:100%; padding:12px; background:#ff9500; color:#fff; border:none; border-radius:10px; font-weight:700;" onclick="SaveFile.import()">📥 Импорт</button>
        <input type="file" id="file-input" style="display:none" onchange="SaveFile.handleFile(event)">
      </div>
      <button style="width:100%; padding:12px; background:#ff3b30; color:#fff; border:none; border-radius:10px; font-weight:700;" onclick="Settings.reset()">СБРОСИТЬ</button>
    </div>
  </div>
</div>

function formatCompact(n) {
  if (n === 0) return '0 ₽';
  const abs = Math.abs(n);
  if (abs < 1000) return Math.floor(n) + ' ₽';
  if (abs < 1_000_000) return (n / 1000).toFixed(1).replace('.0', '') + 'K ₽';

    case 'god': firstLetter = pick(['О','А','Е','К','С','М','Т','Н']); lastLetters = firstLetter + firstLetter; digits = pick(['001','007','777','111','222','333']); region = '77'; beauty = true; break;
  }
  return { text: `${firstLetter} ${digits} ${lastLetters}`, region, beauty };
}
function genPlate(rarity) { if (!rarity) rarity = RARITIES[1]; return genRu(rarity.tier || 'common'); }

const Sound = {
  ctx: null, enabled: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } },
  tone(freq, dur=.15, type='sine', vol=.08) {
    if (!this.enabled) return;
    this.init(); if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    try {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    } catch(e){}
  },
  win(lvl) {
    const notes = { 3:[523,659], 4:[523,659,784], 5:[523,659,784,1047], 6:[523,659,784,1047,1319], 7:[523,659,784,1047,1319,1568], 8:[523,659,784,1047,1319,1568,2093] };
    (notes[lvl] || [523]).forEach((f,i) => setTimeout(() => this.tone(f,.18,'triangle',.07), i*80));
  }
};
const Haptic = { buzz(pattern = 15) { if (navigator.vibrate) navigator.vibrate(pattern); } };

let toastTimer;
function toast(msg, ms = 2500) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

const State = {
  money: CFG.START, bitcoin: 0, inventory: [], maxRecord: 0, spinning: false,
  boosts: {},
};

function saveGame() {
  try {
    localStorage.setItem(CFG.KEY, JSON.stringify({
      money: State.money, bitcoin: State.bitcoin, inventory: State.inventory,
      maxRecord: State.maxRecord, boosts: State.boosts
    }));
  } catch(e) {}
}
function loadGame() {
  const raw = localStorage.getItem(CFG.KEY);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    State.money = d.money || CFG.START; State.bitcoin = d.bitcoin || 0;
    State.inventory = d.inventory || []; State.maxRecord = d.maxRecord || 0;
    State.boosts = d.boosts || {};
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

const SaveFile = {
  export() {
    try {
      const data = { app: 'NomerixReal', money: State.money, bitcoin: State.bitcoin, inventory: State.inventory, boosts: State.boosts };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `nomerix_save_${Date.now()}.json`;
      a.click(); URL.revokeObjectURL(url); toast('✅ Сохранение скачано');
    } catch(e) { toast('⚠ Ошибка'); }
  },
  import() { $('file-input').click(); },
  handleFile(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const d = JSON.parse(e.target.result);
        if (d.app === 'NomerixReal') {
          State.money = d.money; State.bitcoin = d.bitcoin; State.inventory = d.inventory;
          State.boosts = d.boosts;
          saveGame(); UI.updateMoney(); toast('✅ Загружено'); UI.close('settings');
        } else toast('❌ Неверный файл');
      } catch(err) { toast('❌ Ошибка'); }
    };
    reader.readAsText(file);
  }
};

const UI = {
  els: {},
  init() {
    ['money','bitcoin','reels','region','plate','side','price','rarity-name','dots','inv-list','description','shop-content','promo-input'].forEach(id => this.els[id] = $(id));
  },
  open(name) {
    if (State.spinning) return;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = $('scr-' + name);
    if (el) el.classList.add('active');
    if (name === 'inventory') Inventory.render();
    if (name === 'shop') Shop.render();
  },
  close(name) {
    const el = $('scr-' + name); if (el) el.classList.remove('active');
    this.updateMoney();
  },
  updateMoney() {
    this.els.money.textContent = fmtRub(State.money);
    this.els.bitcoin.textContent = fmtBtc(State.bitcoin);
    const cost = this.getSpinCost();
    if (State.money < cost && !State.spinning) {
      this.els.description.textContent = 'НЕ ХВАТАЕТ ДЕНЕГ';
      this.els.description.style.color = '#ff3b30';
    } else if (!State.spinning) {
      this.els.description.textContent = 'Коснись номера, чтобы крутить';
      this.els.description.style.color = '#8e8e93';
    }
  },
  getSpinCost() { return Math.floor(CFG.COST * (1 - (State.boosts.discount || 0) * 0.1)); },
  getPriceMultiplier() { return Math.pow(2, State.boosts.multiplier || 0); },
  setRarity(win) {
    this.els['rarity-name'].textContent = win.name;
    this.els['rarity-name'].style.color = win.color;
    this.els.price.style.color = win.color;
    const dots = this.els.dots.children;
    for (let i = 0; i < dots.length; i++) {
      if (i < win.lvl) { dots[i].style.background = win.color; }
      else { dots[i].style.background = '#e5e5ea'; }
    }
  }
};

function rollRarity() {
  let chances = RARITIES.reduce((acc, r) => { acc[r.lvl] = r.chance; return acc; }, {});
  if (State.boosts.lucky) { let mod = { ...chances }; for (let k in mod) mod[k] = Math.max(0, mod[k] + (k >= 4 ? State.boosts.lucky : -State.boosts.lucky/2)); chances = mod; }
  let total = 0; for (const r of RARITIES) total += chances[r.lvl];
  let rand = Math.random() * total, cum = 0;
  for (const r of RARITIES) { cum += chances[r.lvl]; if (rand <= cum) return r; }
  return RARITIES[1];
}

const Game = {
  spin() {
    const cost = UI.getSpinCost();
    if (State.spinning || State.money < cost) return;
    State.spinning = true; State.money -= cost;
    UI.updateMoney(); Sound.tone(200, .1, 'sawtooth', .05); Haptic.buzz(15);

    const win = rollRarity();
    const generated = genPlate(win);
    const finalPrice = Math.floor((rnd(win.max - win.min) + win.min) * (generated.beauty ? 1.3 : 1.0) * UI.getPriceMultiplier());

    UI.els['rarity-name'].textContent = 'КРУТИМ...'; UI.els['rarity-name'].style.color = '#8e8e93';
    UI.els.price.textContent = '...'; UI.els.price.style.color = '#8e8e93';

    const reels = UI.els.reels; reels.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 20; i++) { const d = document.createElement('div'); d.className = 'reel'; d.textContent = genPlate(RARITIES[1]).text; frag.appendChild(d); }
    const finalDiv = document.createElement('div'); finalDiv.className = 'reel'; finalDiv.textContent = generated.text;
    frag.appendChild(finalDiv); reels.appendChild(frag);
    reels.style.transition = 'none'; reels.style.transform = 'translateY(0px)';
    
    setTimeout(() => {
      reels.style.transition = 'transform 3s cubic-bezier(.15,.85,.2,1)'; reels.style.transform = `translateY(-2000px)`;
      let rTimer = setInterval(() => { if (UI.els.region) UI.els.region.textContent = Math.floor(Math.random()*199)+1; }, 60);
      setTimeout(() => {
        clearInterval(rTimer);
        if (UI.els.region) UI.els.region.textContent = generated.region;
        Game.reveal(win, generated, finalPrice);
      }, 3100);
    }, 50);
  },
  reveal(win, generated, price) {
    UI.setRarity(win); 
    UI.els.description.textContent = 'Номер выпал!'; 
    UI.els.price.textContent = fmtRub(price);

    if (win.lvl >= 4) { Sound.win(win.lvl); Haptic.buzz([30, 50, 80]); } else Sound.win(2);

    Game.animatePrice(price, win, () => {
      State.inventory.push({ id: uid(), plate: generated.text, region: generated.region, price: price, rarity: win, beauty: generated.beauty });
      if (price > State.maxRecord) State.maxRecord = price;
      saveGame(); State.spinning = false; UI.updateMoney();
    });
  },
  animatePrice(target, win, cb) {
    const start = performance.now(); const el = UI.els.price;
    function frame(now) {
      const prog = Math.min((now - start) / 1000, 1);
      el.textContent = fmtRub(target * (1 - Math.pow(1 - prog, 3)));
      if (prog < 1) requestAnimationFrame(frame); else { el.textContent = fmtRub(target); cb(); }
    }
    requestAnimationFrame(frame);
  }
};

const Inventory = {
  render() {
    const list = UI.els['inv-list'];
    if (!State.inventory.length) { list.innerHTML = `<div style="text-align:center; color:#8e8e93; padding:40px;">Пусто</div>`; return; }
    let html = '';
    [...State.inventory].sort((a,b) => b.price - a.price).forEach(item => {
      html += `
        <div style="background:#fff; border:1px solid #e5e5ea; border-radius:12px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:18px; font-weight:800;">${item.plate} <span style="font-size:14px; color:#666;">${item.region}</span></div>
            <div style="color:${item.rarity.color}; font-weight:800; font-size:14px; margin-top:4px;">${fmtRub(item.price)}</div>
          </div>
          <button style="background:#34c759; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:700;" onclick="Inventory.sell('${item.id}')">Продать</button>
        </div>`;
    });
    list.innerHTML = html;
  },
  sell(id) {
    const idx = State.inventory.findIndex(i => i.id === id);
    if (idx < 0) return;
    State.money += State.inventory[idx].price;
    State.inventory.splice(idx, 1); UI.updateMoney(); this.render(); saveGame(); toast(`💰 Продано`);
  }
};

const Shop = {
  render() { 
    const content = UI.els['shop-content']; 
    let html = `<div style="font-weight:800; margin-bottom:16px;">Улучшения (за Биткоины ₿)</div>`; 
    
    BOOSTS.forEach(b => { 
      const lvl = State.boosts[b.id] || 0; 
      const price = b.basePrice * Math.pow(2, lvl); 
      const canBuy = State.bitcoin >= price && lvl < b.maxLvl; 
      const isMax = lvl >= b.maxLvl;
      
      html += `
        <div style="background:#fff; border:1px solid #e5e5ea; border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:800; font-size:14px;">${b.name} <span style="color:#d4af37; font-size:12px;">Ур. ${lvl}/${b.maxLvl}</span></div>
            <div style="font-size:12px; color:#666; margin-top:4px;">${b.desc}</div>
            <div style="font-weight:800; font-size:14px; margin-top:6px;">${isMax ? 'МАКС' : fmtBtc(price)}</div>
          </div>
          <button style="background:#34c759; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:700; opacity:${(!canBuy || isMax) ? 0.5 : 1};" ${(!canBuy || isMax) ? 'disabled' : ''} onclick="Shop.buy('${b.id}')">
            ${isMax ? 'Куплено' : 'Купить'}
          </button>
        </div>`; 
    }); 
    content.innerHTML = html; 
  },
  buy(id) { 
    const b = BOOSTS.find(x => x.id === id); 
    const lvl = State.boosts[id] || 0; 
    const price = b.basePrice * Math.pow(2, lvl); 
    
    if (State.bitcoin < price || lvl >= b.maxLvl) return toast('❌ Мало биткоинов');
    
    State.bitcoin -= price; 
    State.boosts[id] = lvl + 1; 
    
    UI.updateMoney(); 
    this.render(); 
    saveGame(); 
    toast('✅ Улучшено!'); 
  }
};

const Settings = {
  promo() {
    const code = UI.els['promo-input'].value.trim().toUpperCase();
    if (code === 'MOROZIMKA') { UI.els['promo-input'].value = ''; toast('Админка в разработке'); return; }
    
    if (DEFAULT_PROMOS[code]) {
      const val = DEFAULT_PROMOS[code];
      if (typeof val === 'string' && val.startsWith('BTC_')) {
        const btc = parseInt(val.replace('BTC_', ''));
        State.bitcoin += btc;
        toast(`✅ +${btc} ₿`);
      } else if (typeof val === 'string' && val.startsWith('ADMIN_')) {
        UI.els['promo-input'].value = ''; toast('Админка в разработке'); return;
      } else {
        State.money += val;
        toast(`✅ +${fmtRub(val)}`);
      }
      UI.updateMoney(); 
      Sound.win(5);
    } else {
      toast('❌ Неверный код');
    }
    UI.els['promo-input'].value = '';
  },
  reset() { if(confirm('Сбросить прогресс?')) { localStorage.removeItem(CFG.KEY); location.reload(); } }
};

function init() {
  loadGame(); UI.init(); UI.updateMoney(); UI.els.region.textContent = "82";
  document.addEventListener('click', function once() { Sound.init(); document.removeEventListener('click', once); }, { once: true });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
