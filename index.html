<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a17">
<title>Nomerix — Симулятор Номеров</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ГЛОБАЛЬНАЯ ТЕМА (По скриншотам)
   ============================================================ */
:root {
    --bg-main: #050a17;
    --bg-gradient: radial-gradient(circle at 50% 0%, #10214e 0%, #050a17 70%);
    --panel-bg: rgba(18, 30, 63, 0.6);
    --panel-border: rgba(60, 120, 255, 0.3);
    --text-main: #ffffff;
    --text-sub: #8b9bb4;
    --accent-blue: #007aff;
    --accent-glow: 0 0 25px rgba(0, 122, 255, 0.6);
    --gold: #ffd700;
    --sb: env(safe-area-inset-bottom, 0px);
    --st: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; background: #000; color: var(--text-main); }
#app { width: 100vw; height: 100dvh; height: 100vh; position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-gradient); margin: 0 auto; }
@media (min-width: 431px) { body { display: flex; justify-content: center; align-items: center; } #app { max-width: 430px; height: 90vh; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); } }

/* ============================================================
   ВЕРХНЯЯ ПАНЕЛЬ
   ============================================================ */
.top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: calc(16px + var(--st)) 20px 16px; z-index: 100; }
.icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); width: 44px; height: 44px; border-radius: 14px; font-size: 20px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.1s; }
.icon-btn:active { transform: scale(0.9); }
.balances { display: flex; flex-direction: row; gap: 8px; margin-left: auto; align-items: center; }
.bal-box { background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); font-family: 'Orbitron', sans-serif; color: #fff; letter-spacing: 1px; }

/* ============================================================
   ГЛАВНЫЙ ЭКРАН
   ============================================================ */
.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; position: relative; }
.status-bar { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px 16px; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.rarity-info { display: flex; flex-direction: column; gap: 6px; }
.rarity-name { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--accent-blue); letter-spacing: 0.5px; }
.dots { display: flex; gap: 4px; }
.dot { width: 14px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
.price-tag { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: var(--accent-blue); white-space: nowrap; text-shadow: 0 0 10px rgba(0,122,255,0.6); }

/* ЗОНА НОМЕРА */
.plate-zone { width: 100%; display: flex; flex-direction: column; align-items: center; cursor: pointer; margin-bottom: 20px; transition: transform 0.1s; }
.plate-zone:active { transform: scale(0.97); }
.plate { display: grid; grid-template-columns: 1fr 85px; height: 100px; width: 100%; max-width: 380px; background: linear-gradient(180deg, #f4f4f4 0%, #d4d4d4 100%); border-radius: 8px; overflow: hidden; border: 2px solid #fff; box-shadow: 0 0 35px rgba(0,122,255,0.4), inset 0 2px 5px rgba(255,255,255,0.8), 0 10px 20px rgba(0,0,0,0.6); position: relative; }
.plate-main { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.reels { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
.reel { height: 100px; line-height: 100px; text-align: center; font-family: 'Arial Black', Impact, sans-serif; font-size: clamp(42px, 14vw, 56px); white-space: nowrap; color: #111; font-weight: 900; }
.plate-side { display: flex; flex-direction: column; justify-content: center; align-items: center; border-left: 2px solid #111; background: transparent; }
.region { font-family: 'Arial Black', Impact, sans-serif; font-size: 34px; line-height: 1; color: #111; margin-top: -2px;}
.flag-box { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.rus-text { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: 900; color: #111; }
.flag-icon { width: 22px; height: 14px; display: flex; flex-direction: column; border: 1px solid #111; }
.flag-white { flex: 1; background: #fff; }
.flag-blue  { flex: 1; background: #0039a6; }
.flag-red   { flex: 1; background: #d52b1e; }

/* ТЕГИ ПОД НОМЕРОМ */
.tags-container { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 20px; height: 50px; }
.plate-tag { font-size: 14px; font-weight: 600; color: #d0e0ff; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.3; }

.description { font-size: 13px; color: var(--text-sub); font-weight: 600; text-align: center; margin-top: auto; margin-bottom: 40px; }
.bottom-country { position: absolute; bottom: calc(20px + var(--sb)); background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
.bottom-country .flag-icon { width: 18px; height: 12px; border-color: #fff; }

/* ============================================================
   МЕНЮ (Стиль как на скриншоте)
   ============================================================ */
.screen { display: none; flex-direction: column; height: 100%; background: var(--bg-gradient); position: absolute; inset: 0; z-index: 200; overflow-y: auto; }
.screen.active { display: flex; animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.scr-head { display: flex; align-items: center; gap: 16px; padding: calc(16px + var(--st)) 20px 16px; font-size: 18px; font-weight: 800; position: sticky; top: 0; background: rgba(5, 10, 23, 0.9); backdrop-filter: blur(10px); z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); color: #fff; }

.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; }
.menu-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.4); backdrop-filter: blur(10px); aspect-ratio: 1.6; justify-content: flex-end; transition: transform 0.1s; }
.menu-card:active { transform: scale(0.96); }
.menu-card.wide { grid-column: span 2; aspect-ratio: 2.8; }
.menu-card-img { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 60px; opacity: 0.8; background: radial-gradient(circle, rgba(0,122,255,0.3) 0%, transparent 70%); }
.menu-card-title { position: relative; z-index: 2; padding: 10px 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; background: linear-gradient(0deg, rgba(5,10,23,0.95) 0%, rgba(5,10,23,0) 100%); color: #fff; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
.menu-card.active { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0,122,255,0.4); }

/* ============================================================
   СПИСКИ, КНОПКИ, КАЗИНО
   ============================================================ */
.list-item { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #fff; backdrop-filter: blur(5px); }
.btn { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 800; font-size: 12px; cursor: pointer; color: #fff; text-transform: uppercase; transition: transform 0.1s; }
.btn:active { transform: scale(0.95); }
.btn-blue { background: var(--accent-blue); box-shadow: 0 4px 15px rgba(0,122,255,0.4); }
.btn-green { background: #10b981; box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
.btn-red { background: #ef4444; }
.btn-gold { background: var(--gold); color: #000; }

.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; background: var(--accent-blue); color: #fff; font-size: 10px; font-weight: 800; margin-left: 5px; vertical-align: middle; }
.progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: var(--accent-blue); border-radius: 3px; transition: width 0.3s; }

/* КАЗИНО / КЕЙСЫ */
.case-container { display: flex; flex-direction: column; gap: 15px; padding: 20px; align-items: center; }
.case-item { width: 100%; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.case-box { font-size: 64px; filter: drop-shadow(0 0 20px var(--accent-blue)); }

/* МОДАЛКИ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
.modal-overlay.show { display: flex; animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-card { background: #0f1833; border: 1px solid var(--panel-border); border-radius: 20px; padding: 28px 24px 22px; width: 100%; max-width: 340px; text-align: center; box-shadow: var(--accent-glow); animation: modalPop 0.35s cubic-bezier(.2,1.4,.4,1); color: #fff; }
@keyframes modalPop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-emoji { font-size: 56px; line-height: 1; margin-bottom: 12px; }
.modal-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--text-sub); font-weight: 600; margin-bottom: 18px; }
.modal-reward { background: rgba(0,122,255,0.15); border: 1px solid var(--accent-blue); border-radius: 14px; padding: 14px; font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 18px; font-family: 'Orbitron'; }
.modal-btn { width: 100%; background: var(--accent-blue); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(0,122,255,0.4); }

/* ТОСТ */
.toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 800; z-index: 10000; transition: top 0.3s; max-width: 90vw; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.toast.show { top: 40px; }
</style>
</head>
<body>

<div id="app">
  <div id="game" style="height:100%;display:flex;flex-direction:column">
    <div class="top-bar">
      <button class="icon-btn" onclick="UI.open('menu')">☰</button>
      <div class="balances">
        <div class="bal-box" id="money">0 ₽</div>
        <div class="bal-box" id="bitcoin" style="color:var(--gold)">0 ₿</div>
      </div>
    </div>

    <div class="main">
      <div class="status-bar">
        <div class="rarity-info">
          <div class="rarity-name" id="rarity-name">ОБЫЧНЫЙ</div>
          <div class="dots" id="dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
        <div class="price-tag" id="price">0 ₽</div>
      </div>

      <div class="plate-zone" onclick="Game.spin()">
        <div class="plate" id="plate">
          <div class="plate-main">
            <div class="reels" id="reels"><div class="reel">А 000 АА</div></div>
          </div>
          <div class="plate-side">
            <div class="region" id="region">77</div>
            <div class="flag-box">
              <span class="rus-text">RUS</span>
              <div class="flag-icon"><div class="flag-white"></div><div class="flag-blue"></div><div class="flag-red"></div></div>
            </div>
          </div>
        </div>
        
        <div class="tags-container" id="tags-container">
          <div class="plate-tag">Нажми на номер</div>
        </div>
      </div>

      <div class="description" id="description">Стоимость спина: 5 000 ₽</div>
      
      <div class="bottom-country">
        <div class="flag-icon"><div class="flag-white"></div><div class="flag-blue"></div><div class="flag-red"></div></div>
        Россия <span style="color:var(--text-sub)">1 тип</span>
      </div>
    </div>
  </div>

  <!-- ЭКРАН: МЕНЮ -->
  <div id="scr-menu" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('menu')">←</button><span>Меню</span></div>
    <div class="menu-grid">
      
      <!-- Верхняя плитка (Генератор) -->
      <div class="menu-card wide" onclick="UI.close('menu')" style="border-color:var(--accent-blue); box-shadow:0 0 15px rgba(0,122,255,0.3)">
        <div class="menu-card-img">🔢</div>
        <div class="menu-card-title">Генератор</div>
      </div>

      <div class="menu-card wide" onclick="UI.open('tasks')">
        <div class="menu-card-img">📝</div>
        <div class="menu-card-title">Ежедневные задания</div>
      </div>

      <div class="menu-card" onclick="UI.open('collection')">
        <div class="menu-card-img">🗂️</div>
        <div class="menu-card-title">Коллекция</div>
      </div>

      <div class="menu-card" onclick="UI.open('safe')">
        <div class="menu-card-img">🔐</div>
        <div class="menu-card-title">Сейф</div>
      </div>

      <div class="menu-card" onclick="UI.open('garage')">
        <div class="menu-card-img">🏠</div>
        <div class="menu-card-title">Гараж</div>
      </div>

      <!-- КАЗИНО (Кейсы) -->
      <div class="menu-card" onclick="UI.open('cases')" style="border-color:var(--gold); box-shadow:0 0 15px rgba(255,215,0,0.2)">
        <div class="menu-card-img" style="background:radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%)">🎁</div>
        <div class="menu-card-title" style="color:var(--gold)">Казино</div>
      </div>

      <div class="menu-card" onclick="UI.open('upgrades')">
        <div class="menu-card-img">📈</div>
        <div class="menu-card-title">Улучшения</div>
      </div>

      <div class="menu-card" onclick="UI.open('autosell')">
        <div class="menu-card-img">🚚</div>
        <div class="menu-card-title">Автопродажа</div>
      </div>

      <div class="menu-card" onclick="UI.open('auction')">
        <div class="menu-card-img">🤝</div>
        <div class="menu-card-title">Аукцион</div>
      </div>

      <div class="menu-card" onclick="UI.open('buyout')">
        <div class="menu-card-img">💸</div>
        <div class="menu-card-title">Скупка номеров</div>
      </div>

    </div>
  </div>

  <!-- ЭКРАН: КАЗИНО (КЕЙСЫ) -->
  <div id="scr-cases" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('cases')">←</button><span>Казино</span></div>
    <div class="case-container" id="cases-list">
        <!-- Заполняется через JS -->
    </div>
  </div>

  <!-- ЭКРАН: КОЛЛЕКЦИЯ (Инвентарь) -->
  <div id="scr-collection" class="screen">
    <div class="scr-head"><button class="icon-btn" onclick="UI.close('collection')">←</button><span>Коллекция</span></div>
    <div id="inv-list" style="padding:20px;"></div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

/* ============================================================
   КОНФИГ И ДАННЫЕ
   ============================================================ */
const CFG = {
  COST: 5000,
  START: 500000,
  KEY: 'nomerix_v54',
};

const RARITIES = [
  { lvl:1, name:'МУСОР',        color:'#475569', chance:14.0, min:500,       max:5000 },
  { lvl:2, name:'ОБЫЧНЫЙ',      color:'#94a3b8', chance:35.0, min:15000,     max:80000 },
  { lvl:3, name:'НЕОБЫЧНЫЙ',    color:'#10b981', chance:25.0, min:100000,    max:500000 },
  { lvl:4, name:'РЕДКИЙ',       color:'#3b82f6', chance:15.0, min:1000000,   max:5000000 },
  { lvl:5, name:'ЭПИЧЕСКИЙ',    color:'#a855f7', chance:7.0,  min:5000000,   max:15000000 },
  { lvl:6, name:'ЛЕГЕНДАРНЫЙ',  color:'#f59e0b', chance:2.5,  min:15000000,  max:50000000 },
  { lvl:7, name:'БЛАТНОЙ',      color:'#ef4444', chance:1.0,  min:50000000,  max:200000000 },
  { lvl:8, name:'БОЖЕСТВЕННЫЙ', color:'#ec4899', chance:0.5,  min:200000000, max:1000000000 }
];

const TIER_BY_LVL = {1:'trash',2:'common',3:'uncommon',4:'rare',5:'epic',6:'legend',7:'elite',8:'god'};

// Кейсы для казино
const CASES = [
    { id: 'common', name: 'Обычный кейс', icon: '📦', price: 50000, currency: 'rub', rewards: ['money', 'plate'] },
    { id: 'rare', name: 'Редкий кейс', icon: '🎁', price: 5, currency: 'btc', rewards: ['money_big', 'plate_rare'] },
    { id: 'legend', name: 'Легендарный кейс', icon: '💎', price: 25, currency: 'btc', rewards: ['jackpot', 'plate_legend'] }
];

const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const pick = arr => arr[rnd(arr.length)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function fmtRub(n) {
  if (n === 0) return '0 ₽';
  const abs = Math.abs(n);
  if (abs < 1000) return Math.floor(n) + ' ₽';
  if (abs < 1_000_000) return (n/1000).toFixed(1).replace('.0','') + 'K ₽';
  if (abs < 1_000_000_000) return (n/1_000_000).toFixed(1).replace('.0','') + 'M ₽';
  if (abs < 1_000_000_000_000) return (n/1_000_000_000).toFixed(1).replace('.0','') + 'B ₽';
  return (n/1_000_000_000_000).toFixed(1).replace('.0','') + 'T ₽';
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   ГЕНЕРАЦИЯ НОМЕРОВ (С ТЕГАМИ)
   ============================================================ */
const RU_LETTERS = 'АВЕКМНОРСТУХ';
const BEAUTY_TOP = ['А','О','Е','К','М','С','Н','Т'];
const BEAUTY_DIGITS = { uncommon:['001','100','777','007','111','222','999'], rare:['001','777','888','999','123','456','789'], epic:['001','007','777','888','999'], legend:['001','777','888','999'], elite:['001','007','777'], god:['001','007','777'] };
const MIRROR = ['010','101','111','121','202','303','404','505','606','707','808','909','777','555'];
const PREMIUM_REGIONS = ['77','99','97','78','98','177','199','197'];

function genRu(tier) {
  let firstLetter, lastLetters, digits, region;
  let tags = [];

  switch(tier) {
    case 'trash': 
      digits = String(rnd(1000)).padStart(3,'0'); firstLetter = pick(RU_LETTERS); lastLetters = pick(RU_LETTERS)+pick(RU_LETTERS); region = String(150+rnd(50)); 
      tags.push('Без особенностей');
      break;
    case 'common': 
      digits = String(rnd(1000)).padStart(3,'0'); firstLetter = pick(RU_LETTERS); lastLetters = pick(RU_LETTERS)+pick(RU_LETTERS); region = String(30+rnd(120)); 
      if (digits === '777') tags.push('Три семёрки');
      break;
    case 'uncommon': 
      digits = pick(BEAUTY_DIGITS.uncommon); firstLetter = pick(RU_LETTERS); lastLetters = pick(RU_LETTERS)+pick(RU_LETTERS); region = pick(['50','90','150','47','23']); 
      tags.push('Красивые цифры'); 
      break;
    case 'rare': 
      if (Math.random()<0.5) { digits = pick(BEAUTY_DIGITS.rare); tags.push('Красивые цифры'); } 
      else { digits = pick(MIRROR); tags.push('Зеркальные цифры'); }
      firstLetter = pick(BEAUTY_TOP); lastLetters = pick(RU_LETTERS)+pick(RU_LETTERS); region = pick(PREMIUM_REGIONS); 
      break;
    case 'epic': 
      firstLetter = pick(BEAUTY_TOP); 
      if (Math.random() < 0.6) { lastLetters = firstLetter + firstLetter; tags.push('Палиндром букв'); } 
      else { lastLetters = pick(RU_LETTERS)+pick(RU_LETTERS); }
      digits = pick(BEAUTY_DIGITS.epic); region = pick(['77','99','97']); 
      tags.push('Эпичные цифры');
      break;
    case 'legend': 
      firstLetter = pick(BEAUTY_TOP); lastLetters = firstLetter+firstLetter; digits = pick(BEAUTY_DIGITS.legend); region = pick(['77','99','97']); 
      tags.push('Палиндром букв', 'Легендарные цифры');
      break;
    case 'elite': 
      firstLetter = pick(['О','Е','К','М','С']); lastLetters = firstLetter + pick(['О','Е','К','М','С']); digits = pick(['001','007','777','888']); region = '77'; 
      tags.push('Элитный номер');
      break;
    case 'god': 
      firstLetter = pick(['О','А','Е','К']); lastLetters = firstLetter+firstLetter; digits = pick(['001','007','777']); region = '77'; 
      tags.push('Божественный', 'Абсолютный палиндром');
      break;
    default: 
      digits = String(rnd(1000)).padStart(3,'0'); firstLetter = pick(RU_LETTERS); lastLetters = pick(RU_LETTERS)+pick(RU_LETTERS); region = '77';
  }
  
  if (tags.length === 0) tags.push('Обычный номер');

  return { text: `${firstLetter} ${digits} ${lastLetters}`, region, tags };
}

function genPlate(rarity) {
  if (!rarity) rarity = RARITIES[1];
  const tier = TIER_BY_LVL[rarity.lvl] || 'common';
  return genRu(tier);
}
const RANDOM_REEL_TEXTS = Array.from({length:20}, () => genPlate(RARITIES[1]).text);

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const DEFAULT_STATE = {
  money: CFG.START,
  bitcoin: 10, // Дадим немного на старт для теста казино
  inventory: [],
  spinning: false,
  lastDaily: 0
};

let State = JSON.parse(JSON.stringify(DEFAULT_STATE));

function saveGame() { try { localStorage.setItem(CFG.KEY, JSON.stringify(State)); } catch(e){} }
function loadGame() {
  const raw = localStorage.getItem(CFG.KEY);
  if (raw) { try { State = { ...State, ...JSON.parse(raw), spinning: false }; } catch(e){} }
}

/* ============================================================
   UI И НАВИГАЦИЯ
   ============================================================ */
const UI = {
  open(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $('scr-'+id).classList.add('active');
    if (id === 'collection') this.renderInventory();
    if (id === 'cases') this.renderCases();
  },
  close(id) { $('scr-'+id).classList.remove('active'); this.update(); },
  update() {
    $('money').textContent = fmtRub(State.money);
    $('bitcoin').textContent = State.bitcoin + ' ₿';
  },
  setRarity(win) {
    $('rarity-name').textContent = win.name;
    $('rarity-name').style.color = win.color;
    $('price').style.color = win.color;
    const dots = $('dots').children;
    for (let i=0; i<dots.length; i++) {
      dots[i].style.background = i < win.lvl ? win.color : 'rgba(255,255,255,0.1)';
    }
  },
  resetDots() {
    $('dots').querySelectorAll('.dot').forEach(d => d.style.background = 'rgba(255,255,255,0.1)');
  },
  renderInventory() {
    let html = '';
    if (!State.inventory.length) html = '<div style="text-align:center;color:var(--text-sub);padding:20px;">Пусто. Крути номера!</div>';
    State.inventory.forEach((i, idx) => {
      html += `<div class="list-item">
        <div>
          <b style="font-size:16px;">${i.plate} ${i.region}</b><br>
          <span style="color:${i.color};font-size:12px;font-weight:800;">${fmtRub(i.price)}</span>
        </div>
        <button onclick="Game.sell(${idx})" class="btn btn-blue">Продать</button>
      </div>`;
    });
    $('inv-list').innerHTML = html;
  },
  renderCases() {
    let html = '';
    CASES.forEach(c => {
      const priceStr = c.currency === 'btc' ? c.price + ' ₿' : fmtRub(c.price);
      html += `<div class="case-item">
        <div class="case-box">${c.icon}</div>
        <div style="font-weight:800; font-size:16px;">${c.name}</div>
        <button onclick="Casino.openCase('${c.id}')" class="btn btn-blue" style="width:100%;">Купить за ${priceStr}</button>
      </div>`;
    });
    $('cases-list').innerHTML = html;
  }
};

/* ============================================================
   ИГРА (Спин)
   ============================================================ */
function rollRarity() {
  const chances = RARITIES.map(r => r.chance);
  let total = chances.reduce((a,b)=>a+b,0);
  let r = Math.random() * total, cum = 0;
  for (let i=0; i<RARITIES.length; i++) { cum += chances[i]; if (r <= cum) return RARITIES[i]; }
  return RARITIES[1];
}

const Game = {
  spin() {
    if (State.spinning) return;
    const cost = CFG.COST;
    if (State.money < cost) return showToast('Не хватает денег!');

    State.spinning = true;
    State.money -= cost;
    UI.update();
    UI.resetDots();
    if (navigator.vibrate) navigator.vibrate(10);

    const win = rollRarity();
    const generated = genPlate(win);
    
    // Базовый множитель за теги
    let tagMultiplier = 1 + (generated.tags.length * 0.2);
    const finalPrice = Math.floor((rnd(win.max - win.min) + win.min) * tagMultiplier);

    $('rarity-name').textContent = 'КРУТИМ...';
    $('rarity-name').style.color = 'var(--text-sub)';
    $('price').textContent = '...';
    $('price').style.color = 'var(--text-sub)';
    $('tags-container').innerHTML = '<div class="plate-tag">Крутим барабаны...</div>';

    const reels = $('reels');
    reels.innerHTML = '';
    const frag = document.createDocumentFragment();
    RANDOM_REEL_TEXTS.forEach(text => {
      const d = document.createElement('div'); d.className = 'reel'; d.textContent = text; frag.appendChild(d);
    });
    const finalDiv = document.createElement('div'); finalDiv.className = 'reel'; finalDiv.textContent = generated.text; frag.appendChild(finalDiv);
    reels.appendChild(frag);

    reels.style.transition = 'none';
    reels.style.transform = 'translateY(0px)';
    void reels.offsetHeight;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const targetY = -(RANDOM_REEL_TEXTS.length * 100);
        reels.style.transition = 'transform 2.5s cubic-bezier(.15,.85,.2,1)';
        reels.style.transform = `translateY(${targetY}px)`;

        let rTimer = setInterval(() => { $('region').textContent = rnd(199)+1; }, 60);

        setTimeout(() => {
          clearInterval(rTimer);
          $('region').textContent = generated.region;
          UI.setRarity(win);
          $('price').textContent = fmtRub(finalPrice);
          
          // Вывод тегов под номером
          let tagsHtml = generated.tags.map(t => `<div class="plate-tag">${t}</div>`).join('');
          $('tags-container').innerHTML = tagsHtml;

          if (win.lvl >= 5) {
            if (navigator.vibrate) navigator.vibrate([30,50,30]);
            $('plate').style.boxShadow = `0 0 40px ${win.color}, 0 10px 20px rgba(0,0,0,0.6)`;
            setTimeout(() => $('plate').style.boxShadow = '', 1500);
          }

          State.inventory.push({ plate: generated.text, region: generated.region, price: finalPrice, color: win.color, tags: generated.tags });
          saveGame();
          State.spinning = false;
          UI.update();
        }, 2600);
      });
    });
  },
  sell(idx) {
    State.money += State.inventory[idx].price;
    State.inventory.splice(idx, 1);
    UI.update(); UI.renderInventory(); saveGame();
    showToast('✅ Номер продан!');
  }
};

/* ============================================================
   КАЗИНО (Кейсы)
   ============================================================ */
const Casino = {
  openCase(caseId) {
    const c = CASES.find(x => x.id === caseId);
    if (!c) return;

    // Оплата
    if (c.currency === 'rub') {
      if (State.money < c.price) return showToast('Не хватает рублей!');
      State.money -= c.price;
    } else {
      if (State.bitcoin < c.price) return showToast('Не хватает BTC!');
      State.bitcoin -= c.price;
    }
    UI.update();

    // Анимация открытия (просто визуал)
    showToast('Открываем кейс...');
    
    setTimeout(() => {
      // Логика призов
      const roll = Math.random();
      let msg = '';

      if (caseId === 'common') {
        if (roll < 0.7) {
          // Деньги (от 20к до 150к)
          const winMoney = 20000 + rnd(130000);
          State.money += winMoney;
          msg = `Выпало: ${fmtRub(winMoney)}`;
        } else {
          // Рандомный номер
          const r = rollRarity();
          const gen = genPlate(r);
          const price = rnd(r.max - r.min) + r.min;
          State.inventory.push({ plate: gen.text, region: gen.region, price, color: r.color, tags: gen.tags });
          msg = `Выпал номер: ${gen.text} (${fmtRub(price)})`;
        }
      } 
      else if (caseId === 'rare') {
        if (roll < 0.5) {
          const winMoney = 500000 + rnd(2000000);
          State.money += winMoney;
          msg = `Выпало: ${fmtRub(winMoney)}`;
        } else {
          // Редкий номер или выше
          const r = RARITIES[3 + rnd(4)]; 
          const gen = genPlate(r);
          const price = rnd(r.max - r.min) + r.min;
          State.inventory.push({ plate: gen.text, region: gen.region, price, color: r.color, tags: gen.tags });
          msg = `Выпал РЕДКИЙ номер: ${gen.text}`;
        }
      }
      else if (caseId === 'legend') {
        if (roll < 0.3) {
          const winBtc = 10 + rnd(40);
          State.bitcoin += winBtc;
          msg = `ДЖЕКПОТ: ${winBtc} ₿!`;
        } else {
          // Легендарный номер
          const r = RARITIES[5 + rnd(3)]; 
          const gen = genPlate(r);
          const price = rnd(r.max - r.min) + r.min;
          State.inventory.push({ plate: gen.text, region: gen.region, price, color: r.color, tags: gen.tags });
          msg = `Выпал ЛЕГЕНДАРНЫЙ номер: ${gen.text}`;
        }
      }

      saveGame();
      UI.update();
      
      // Просто алерт для демонстрации (можно заменить на красивую модалку)
      alert(msg);
      
    }, 800);
  }
};

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function initGame() {
  loadGame();
  UI.update();
  $('region').textContent = "77";
}

window.addEventListener('load', () => {
  setTimeout(() => {
    initGame();
  }, 100);
});
</script>
